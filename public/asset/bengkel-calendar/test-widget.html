<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Widget Kalender Libur</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background-color: #f7f9fc;
        margin: 0;
        padding: 20px;
      }
      .header {
        text-align: center;
        margin-bottom: 30px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Integrasi Bengkel Calendar</h1>
      <p>Hanya dengan satu tag script!</p>
    </div>

    <!-- Container untuk widget -->
    <div id="kalender-container"></div>

    <!-- Panggil script widget -->
    <script src="./dist-widget/bengkel-calendar.js"></script>

    <!-- Render widget -->
    <script>
      // Pastikan script sudah ter-load
      if (window.BengkelCalendar) {
        // Tentukan ID elemen tempat kalender akan di-render (dalam hal ini 'kalender-container')
        window.BengkelCalendar.render("kalender-container");
      } else {
        console.error("Gagal memuat script widget BengkelCalendar");
      }

      const events = window.BengkelCalendar.getEvents();
      console.log(events);
    </script>
  </body>
</html>
